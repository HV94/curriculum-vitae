<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <title>Curriculum Vitae - Valentyn Haidukov</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      min-height: 100vh;
      min-height: -webkit-fill-available;
      min-height: 100dvh;
      background: radial-gradient(circle at 50% 30%, #1e293b 0%, #0b0f19 100%);
      color: #f8fafc;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      overflow-x: hidden;
    }

    body {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: env(safe-area-inset-top, 10px) 12px env(safe-area-inset-bottom, 10px);
    }

    /* Top Navigation Bar */
    .top-bar {
      width: 100%;
      max-width: 900px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.6rem 0.5rem;
      gap: 0.5rem;
      z-index: 10;
    }

    .btn-nav {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #f8fafc;
      padding: 0.45rem 0.95rem;
      border-radius: 9999px;
      text-decoration: none;
      font-size: 0.82rem;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      transition: all 0.2s ease;
      white-space: nowrap;
    }

    .btn-nav:hover, .btn-nav:active {
      background: rgba(255, 255, 255, 0.18);
      transform: translateY(-1px);
    }

    .btn-download {
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      border-color: rgba(255, 255, 255, 0.25);
      box-shadow: 0 4px 14px rgba(37, 99, 235, 0.45);
    }

    .btn-download:hover, .btn-download:active {
      background: linear-gradient(135deg, #3b82f6, #2563eb);
      box-shadow: 0 6px 18px rgba(37, 99, 235, 0.6);
    }

    /* Perfectly Centered CV Container */
    .cv-viewport {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
      max-width: 960px;
      padding: 0.5rem 0;
    }

    .cv-card {
      width: auto;
      max-width: 96vw;
      max-height: calc(100dvh - 100px);
      aspect-ratio: 210 / 297;
      object-fit: contain;
      border-radius: 10px;
      background: #ffffff;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.75), 0 0 0 1px rgba(255, 255, 255, 0.1);
      display: block;
    }

    /* Subtle bottom hint */
    .bottom-hint {
      font-size: 0.72rem;
      color: #94a3b8;
      text-align: center;
      padding: 0.3rem 0;
      opacity: 0.8;
    }
  </style>
</head>
<body>

  <!-- Top Bar with Actions -->
  <header class="top-bar">
    <a href="index.html" class="btn-nav">
      &larr; Portfolio
    </a>
    <a href="Curriculum_Valentyn_Haidukov.pdf" download class="btn-nav btn-download">
      📥 Scarica PDF (A4)
    </a>
  </header>

  <!-- Perfectly Centered Document Viewport -->
  <main class="cv-viewport">
    <img src="anteprima.png" alt="Curriculum Vitae - Valentyn Haidukov" class="cv-card">
  </main>

  <footer class="bottom-hint">
    Pizzica lo schermo per ingrandire &bull; Formato Ufficiale A4
  </footer>

</body>
</html>
